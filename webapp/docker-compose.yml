services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: cofpred
      POSTGRES_USER: cofpred
      POSTGRES_PASSWORD: cofpred
    ports:
      - "5432:5432"
    volumes:
      - cofpred_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofpred -d cofpred"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ..
      dockerfile: webapp/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://cofpred:cofpred@timescaledb:5432/cofpred
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: webapp/backend/Dockerfile
    command: ["python", "-m", "webapp.backend.app.workers.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://cofpred:cofpred@timescaledb:5432/cofpred
      REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: webapp/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  cofpred_pg:

